plugins {
  id 'java' // Without this, there is no 'build' task available!
  id 'dev.architectury.loom' version '1.14.476' apply false
  id 'architectury-plugin' version '3.5.166'
  id 'com.gradleup.shadow' version '9.4.2' apply false
  id 'io.github.pacifistmc.forgix' version '2.0.0'
  id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

def minecraftMatrix = new Properties()
file('gradle/minecraft-versions.properties').withInputStream { minecraftMatrix.load(it) }

ext.supported_minecraft_versions = minecraftMatrix.supported_targets.split(',').collect { it.trim() }
def minecraftPropertiesByVersion = supported_minecraft_versions.collectEntries { minecraftVersion ->
  def minecraftProperties = new Properties()
  file("gradle/minecraft-versions/${minecraftVersion}.properties").withInputStream { minecraftProperties.load(it) }
  [(minecraftVersion): minecraftProperties]
}
ext.enabled_minecraft_versions = supported_minecraft_versions.findAll { minecraftVersion ->
  minecraftPropertiesByVersion[minecraftVersion].getProperty('enabled', 'true').toBoolean()
}

if (enabled_minecraft_versions.isEmpty()) {
  throw new GradleException('At least one Minecraft target must be enabled.')
}

def requestedTargetMinecraft = findProperty('targetMinecraft')?.toString()?.replace('_', '.')
ext.target_minecraft = requestedTargetMinecraft ?: (enabled_minecraft_versions.contains(minecraftMatrix.latest_target) ? minecraftMatrix.latest_target : enabled_minecraft_versions.last())

if (!supported_minecraft_versions.contains(target_minecraft)) {
  throw new GradleException("Unsupported Minecraft target '${target_minecraft}'. Supported targets: ${supported_minecraft_versions.join(', ')}")
}
if (!enabled_minecraft_versions.contains(target_minecraft)) {
  throw new GradleException("Minecraft target '${target_minecraft}' is disabled. Set enabled=true in gradle/minecraft-versions/${target_minecraft}.properties to build it.")
}

def targetMinecraftProperties = minecraftPropertiesByVersion[target_minecraft]
targetMinecraftProperties.each { key, value -> ext.set(key.toString(), value.toString()) }

architectury {
  minecraft = rootProject.minecraft_version
}

allprojects {
  group = rootProject.maven_group
  version = rootProject.mod_version + '+' + rootProject.minecraft_version
}

forgix {
  autoRun = true
  silence = true
  archiveClassifier = ''

  fabric {
    inputJar = project(':fabric').tasks.remapJar.archiveFile
  }
  neoforge {
    inputJar = project(':neoforge').tasks.remapJar.archiveFile
  }
}

publishMods {
  def forgixDir = rootProject.layout.buildDirectory.dir('forgix').get().asFile
  file = new File(forgixDir, "${rootProject.archives_name}-${project.version}.jar")
  changelog = new File('CHANGELOG.md').getText('UTF-8')
  type = STABLE
  modLoaders.add('fabric')
  modLoaders.add('neoforge')

  modrinth {
    accessToken = providers.environmentVariable('MODRINTH_TOKEN')
    projectId = 'r52WhXUn'
    requires('architectury-api')
    minecraftVersions.add(rootProject.minecraft_version)
  }

  curseforge {
    accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
    projectId = '1273776'
    clientRequired = true
    serverRequired = true
    requires('architectury-api')
    javaVersions.add(JavaVersion.toVersion(rootProject.java_version))
    minecraftVersions.add(rootProject.minecraft_version)
  }
}

// Delete unnecessary copied JAR files
tasks.named('build').configure {
  dependsOn subprojects.collect { it.tasks.named('build') }

  doLast {
    def libsDir = rootProject.layout.buildDirectory.dir('libs').get().asFile
    delete new File(libsDir, "${rootProject.archives_name}-${project.version}.jar").absolutePath
    delete new File(libsDir, "${rootProject.archives_name}-common-${project.version}.jar").absolutePath
  }
}

tasks.register('collectBuiltJars', Copy) {
  description = "Collect ${rootProject.minecraft_version} build outputs into one directory."
  group = 'build'
  dependsOn tasks.named('build')
  dependsOn ':common:copyToRoot', ':fabric:copyToRoot', ':neoforge:copyToRoot', ':mergeJars'

  from(rootProject.layout.buildDirectory.dir('libs')) {
    include "${rootProject.archives_name}-fabric-${project.version}.jar"
    include "${rootProject.archives_name}-neoforge-${project.version}.jar"
  }
  from(rootProject.layout.buildDirectory.dir('forgix')) {
    include "${rootProject.archives_name}-${project.version}.jar"
  }
  into rootProject.layout.buildDirectory.dir("collected-jars/${rootProject.minecraft_version}")
}

def minecraftBuildTasks = []
enabled_minecraft_versions.eachWithIndex { minecraftVersion, index ->
  def taskName = "buildMinecraft${minecraftVersion.replace('.', '_')}"
  def minecraftBuildTask = tasks.register(taskName, Exec) {
    description = "Build and collect jars for Minecraft ${minecraftVersion}."
    group = 'build'
    workingDir = rootProject.projectDir
    commandLine = [
      System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : './gradlew',
      "-PtargetMinecraft=${minecraftVersion.replace('.', '_')}",
      'build',
      'collectBuiltJars'
    ]
  }

  if (index > 0) {
    minecraftBuildTask.configure {
      mustRunAfter minecraftBuildTasks[index - 1]
    }
  }

  minecraftBuildTasks.add(minecraftBuildTask)
}

tasks.register('buildAllMinecraftVersions') {
  description = 'Build all supported Minecraft targets.'
  group = 'build'
  dependsOn minecraftBuildTasks
}

tasks.register('collectAllBuiltJars', Copy) {
  description = 'Collect all Minecraft target jars into one flat directory.'
  group = 'build'
  dependsOn tasks.named('buildAllMinecraftVersions')

  from(rootProject.layout.buildDirectory.dir('collected-jars')) {
    include '*/*.jar'
  }
  into rootProject.layout.buildDirectory.dir('collected-jars/all')
}

// Delete 'build' directory at the root when running 'clean' task
tasks.named('clean').configure {
  dependsOn subprojects.collect { it.tasks.named('clean') }

  doLast { delete rootProject.layout.buildDirectory }
}

subprojects {
  apply plugin: 'dev.architectury.loom'
  apply plugin: 'architectury-plugin'
  apply plugin: 'maven-publish'

  base {
    // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
    archivesName = "$rootProject.archives_name-$project.name"
  }

  repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
  }

  loom {
    silentMojangMappingsLicense()
  }

  dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()
  }

  java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
    targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
  }

  tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version as Integer
  }

  // Configure Maven publishing.
  publishing {
    publications {
      mavenJava(MavenPublication) {
        artifactId = base.archivesName.get()
        from components.java
      }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
      // Add repositories to publish to here.
      // Notice: This block does NOT have the same function as the block in the top level.
      // The repositories here will be used for publishing your artifact, not for
      // retrieving dependencies.
    }
  }

  // Copy build output to root project build directory
  tasks.register('copyToRoot', Copy) {
    description = "Copy ${project.name} output into ${rootProject.layout.buildDirectory.dir('libs')}"
    dependsOn tasks.named('build')
    from(layout.buildDirectory.dir('libs')) {
      include "${rootProject.archives_name}-${project.name}-${project.version}.jar"
    }
    into(rootProject.layout.buildDirectory.dir('libs'))
  }
  tasks.named('build') { finalizedBy tasks.named('copyToRoot') }
}
